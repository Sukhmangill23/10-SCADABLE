[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "live-swot-research"
version = "0.1.0"
description = "Scraping and LLM scaffolding for SCADABLE competitor intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2,<3",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "pipeline"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
