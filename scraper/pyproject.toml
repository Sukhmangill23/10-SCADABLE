[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "scadable-scraper"
version = "0.1.0"
description = "Standalone, source-linked competitor scraping with Crawl4AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "crawl4ai==0.9.5",
    "pydantic>=2.12,<3",
    "httpx>=0.28,<1",
    "defusedxml>=0.7,<1",
    "protego>=0.5,<1",
    "playwright>=1.64,<2",
    "rich>=14,<16",
]

[project.scripts]
scadable-scraper = "scadable_scraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

[tool.setuptools]
packages = ["scadable_scraper", "scadable_scraper.discovery"]

[tool.setuptools.package-dir]
scadable_scraper = "src"

[tool.setuptools.package-data]
scadable_scraper = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = ["browser: opt-in Chromium tests against loopback fixture servers only"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["scadable_scraper"]
